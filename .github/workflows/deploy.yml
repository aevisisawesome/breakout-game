# Deploy path (Implementation Plan M0): build the static site and publish to GitHub Pages
# on every push to main, so playtests are one link. Requires Pages to be enabled for the
# repository with "GitHub Actions" as the source (Settings → Pages) once a remote exists.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # Formatting and lint are blocking gates on the deploy (TDD Decision Log, 2026-08-07):
      # repo-wide Prettier drift accumulated unnoticed because CI never checked it. A trivial
      # formatting slip now blocks a playtest deploy; the fix is to run `npm run format`.
      - run: npm run format:check
      - run: npm run lint
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
